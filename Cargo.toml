[workspace]
members = ["apps/server", "apps/server/src/generated", "apps/desktop/src-tauri", "packages/diagnostics"]
resolver = "3"

[workspace.package]
version = "2026.10.17"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
base64 = "0.22"
axum = "=0.8.9"
buffa = { version = "=0.9.1", features = ["json"] }
connectrpc = { version = "=0.9.0", features = ["axum"] }
clap = { version = "=4.6.7", features = ["derive"] }
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "query", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
same-file = "1.0"
sqlx = { version = "=0.9.0", default-features = false, features = [
    "runtime-tokio", "sqlite-bundled", "macros", "migrate",
] }
subtle = "2.6"
tempfile = "3"
thiserror = "2"
tokio = { version = "=1.53.3", features = [
    "fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time",
] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
regex = "1"
popcorn-diagnostics = { path = "packages/diagnostics" }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
