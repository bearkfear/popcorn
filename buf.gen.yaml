version: v2
clean: true
plugins:
  - local: target/codegen/bin/protoc-gen-buffa
    out: apps/server/src/generated/buffa
    opt: [views=true, json=true]
  - local: target/codegen/bin/protoc-gen-buffa-packaging
    out: apps/server/src/generated/buffa
    strategy: all
  - local: target/codegen/bin/protoc-gen-connect-rust
    out: apps/server/src/generated/connect
    opt: [buffa_module=crate::proto]
  - local: target/codegen/bin/protoc-gen-buffa-packaging
    out: apps/server/src/generated/connect
    strategy: all
    opt: [filter=services]
  - local: [bun, node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es]
    out: packages/sdk/src/gen
    opt: [target=ts]
