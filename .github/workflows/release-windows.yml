name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag da release (deve coincidir com a versão do Tauri, por exemplo v0.1.0)"
        required: true
        type: string

concurrency:
  group: release-windows-${{ github.event.inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish NSIS installer
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.94 MSVC toolchain
        shell: pwsh
        run: |
          rustup toolchain install 1.94.0-x86_64-pc-windows-msvc --profile minimal
          rustup default 1.94.0-x86_64-pc-windows-msvc

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate release version
        shell: pwsh
        run: |
          $tauri = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($tauri.version)"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' does not match Tauri version '$expectedTag'."
          }
          "APP_VERSION=$($tauri.version)" >> $env:GITHUB_ENV

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows installer
        run: bun run desktop:build

      - name: Collect release assets
        id: assets
        shell: pwsh
        run: |
          $searchRoots = @("target", "apps/desktop/src-tauri/target") |
            Where-Object { Test-Path $_ }
          $installers = @(
            Get-ChildItem -Path $searchRoots -Recurse -File -Filter "*-setup.exe" |
              Where-Object { $_.FullName -match '[\\/]bundle[\\/]nsis[\\/]' }
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }

          New-Item -ItemType Directory -Force release | Out-Null
          $installer = $installers[0]
          $destination = Join-Path (Resolve-Path release) $installer.Name
          Copy-Item $installer.FullName $destination
          $hash = (Get-FileHash $destination -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" |
            Set-Content (Join-Path (Resolve-Path release) "SHA256SUMS.txt") -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: popcorn-windows-${{ env.APP_VERSION }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            gh release create $env:RELEASE_TAG @assets `
              --target $env:GITHUB_SHA `
              --title "Popcorn $env:APP_VERSION" `
              --generate-notes
          }
