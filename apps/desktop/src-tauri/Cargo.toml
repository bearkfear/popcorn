[package]
name = "popcorn-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
default-run = "popcorn-desktop"

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener", "dep:tauri-plugin-dialog", "dep:tauri-plugin-single-instance"]

[[bin]]
name = "popcorn-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
popcorn-diagnostics.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
tauri = { version = "=2.12.4", optional = true , features = ["tray-icon"] }
tauri-plugin-opener = { version = "=2.7.2", optional = true }

tauri-plugin-dialog = { version = "=2.8.3", optional = true }
tauri-plugin-single-instance = { version = "=2.5.4", optional = true }

[build-dependencies]
tauri-build = { version = "=2.7.3", optional = true , features = [] }

[lints]
workspace = true
